name: Native and Python correctness
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest numpy scipy networkx
      - run: python -m compileall -q kernels evaluation benchmarks applications
      - run: python -m pytest tests kernels applications -q --import-mode=importlib
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [feed_handler, matching_engine, network/udp]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtest-dev libbenchmark-dev
      - run: cmake -S cpp/src/${{ matrix.component }} -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path rust/Cargo.toml
  c-queues:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure shadow-memory-compatible ASLR for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cc -std=c11 -D_POSIX_C_SOURCE=200809L -O1 -g -fsanitize=thread -pthread kernels/queue/queue.c kernels/queue/test_queue_native.c -o /tmp/queue-check
      - run: /tmp/queue-check
        env:
          TSAN_OPTIONS: halt_on_error=1
