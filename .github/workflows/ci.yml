name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"
  POETRY_VERSION: "1.7.1"

jobs:
  # ── Lint & Format ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort bandit

      - name: Ruff lint
        run: ruff check kernels/ evaluation/ benchmarks/ tests/

      - name: Black format check
        run: black --check kernels/ evaluation/ benchmarks/ tests/

      - name: isort import order
        run: isort --check-only kernels/ evaluation/ benchmarks/ tests/

      - name: MyPy type check
        run: |
          mypy kernels/ --ignore-missing-imports --no-strict-optional || true

  # ── Security Scan ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r kernels/ evaluation/ benchmarks/ -f json -o bandit-report.json || true
          bandit -r kernels/ evaluation/ benchmarks/ -ll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: pip-audit dependency check
        run: |
          pip install pip-audit
          pip-audit --desc || true

  # ── Unit Tests ─────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          # Reduce matrix size — macOS only on latest Python
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark hypothesis
          pip install numpy scipy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=kernels \
            --cov=evaluation \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14

  # ── Kernel Benchmarks ──────────────────────────────────────────
  kernel-benchmarks:
    name: Kernel Benchmarks
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run JSSP kernel benchmarks
        run: |
          python -m pytest benchmarks/ -v --benchmark-only --benchmark-json=benchmark-results.json || echo "No benchmark tests found, running inline benchmarks"
          
          # Inline benchmark if no pytest benchmarks exist
          if [ ! -f benchmark-results.json ]; then
            python -c "
          import time
          import json
          import sys
          sys.path.insert(0, '.')
          
          results = {}
          
          # JSSP benchmark
          try:
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              # Small 5x5 JSSP instance
              n_jobs, n_machines = 5, 5
              durations = [[3, 2, 4, 1, 5], [2, 4, 3, 5, 1], [4, 1, 5, 2, 3], [1, 5, 2, 3, 4], [5, 3, 1, 4, 2]]
              machines = [[0, 1, 2, 3, 4], [1, 0, 3, 2, 4], [2, 3, 0, 4, 1], [3, 4, 1, 0, 2], [4, 2, 3, 1, 0]]
              instance = JSSPInstance(n_jobs, n_machines, durations, machines)
              solver = JSSPSolver(instance)
              
              times = []
              for _ in range(100):
                  start = time.perf_counter()
                  solution = solver.solve()
                  elapsed = time.perf_counter() - start
                  times.append(elapsed)
              
              results['jssp_5x5'] = {
                  'mean_ms': sum(times) / len(times) * 1000,
                  'min_ms': min(times) * 1000,
                  'max_ms': max(times) * 1000,
                  'makespan': solution.makespan if hasattr(solution, 'makespan') else 'N/A'
              }
          except Exception as e:
              results['jssp_5x5'] = {'error': str(e)}
          
          # RCPSP benchmark
          try:
              from kernels.scheduling.rcpsp import RCPSPSolver, RCPSPInstance
              n_tasks = 10
              n_resources = 2
              durations = [3, 4, 2, 5, 1, 3, 4, 2, 5, 1]
              resource_reqs = [[1, 0], [0, 1], [1, 1], [2, 0], [0, 2], [1, 0], [0, 1], [1, 1], [2, 0], [0, 1]]
              resource_avail = [2, 2]
              predecessors = [[], [0], [0], [1, 2], [2], [3], [4], [5, 6], [7], [8]]
              instance = RCPSPInstance(n_tasks, n_resources, durations, resource_reqs, resource_avail, predecessors)
              solver = RCPSPSolver(instance)
              
              times = []
              for _ in range(100):
                  start = time.perf_counter()
                  solution = solver.solve()
                  elapsed = time.perf_counter() - start
                  times.append(elapsed)
              
              results['rcpsp_10t'] = {
                  'mean_ms': sum(times) / len(times) * 1000,
                  'min_ms': min(times) * 1000,
                  'max_ms': max(times) * 1000,
                  'makespan': solution.makespan if hasattr(solution, 'makespan') else 'N/A'
              }
          except Exception as e:
              results['rcpsp_10t'] = {'error': str(e)}
          
          with open('benchmark-results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          print(json.dumps(results, indent=2))
          "
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

      - name: Benchmark summary
        run: |
          echo "## Kernel Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark-results.json ]; then
            python -c "
          import json
          with open('benchmark-results.json') as f:
              data = json.load(f)
          for name, metrics in data.items():
              if 'error' in metrics:
                  print(f'| {name} | ERROR: {metrics[\"error\"][:50]} |')
              else:
                  print(f'| {name} | {metrics[\"mean_ms\"]:.3f} ms (mean) | {metrics[\"min_ms\"]:.3f} ms (min) | {metrics[\"max_ms\"]:.3f} ms (max) |')
          " >> $GITHUB_STEP_SUMMARY
          fi

  # ── Build Package ──────────────────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build package
        run: |
          if [ -f pyproject.toml ]; then
            python -m build
          elif [ -f setup.py ]; then
            python setup.py sdist bdist_wheel
          else
            echo "No pyproject.toml or setup.py found, skipping build"
            # Create a minimal package structure for validation
            mkdir -p dist
            echo "Package validation only" > dist/README.txt
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Documentation Build ────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install docs dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings[python] || true

      - name: Validate markdown
        run: |
          pip install markdownlint-cli || true
          markdownlint "docs/**/*.md" "reports/**/*.md" || echo "markdownlint not available, skipping"

      - name: Check documentation links
        run: |
          pip install linkchecker || true
          # Basic link validation
          python -c "
          import re
          import os
          import sys
          
          broken = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              for f in files:
                  if f.endswith('.md'):
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              content = fh.read()
                          links = re.findall(r'\[([^\]]+)\]\(([^)]+)\)', content)
                          for text, url in links:
                              if url.startswith('http'):
                                  continue  # Skip external links
                              if url.startswith('#'):
                                  continue  # Skip anchors
                              # Remove anchor from local links
                              local_path = url.split('#')[0]
                              if local_path and not os.path.exists(os.path.join(root, local_path)):
                                  broken.append(f'{path}: {url}')
                      except Exception as e:
                          print(f'Error reading {path}: {e}')
          
          if broken:
              print('Broken links found:')
              for b in broken:
                  print(f'  {b}')
          else:
              print('No broken internal links found')
          "

  # ── Performance Regression ─────────────────────────────────────
  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: [kernel-benchmarks]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Run baseline benchmarks
        run: |
          python -c "
          import time, json, sys
          sys.path.insert(0, '.')
          results = {}
          try:
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              n_jobs, n_machines = 5, 5
              durations = [[3,2,4,1,5],[2,4,3,5,1],[4,1,5,2,3],[1,5,2,3,4],[5,3,1,4,2]]
              machines = [[0,1,2,3,4],[1,0,3,2,4],[2,3,0,4,1],[3,4,1,0,2],[4,2,3,1,0]]
              instance = JSSPInstance(n_jobs, n_machines, durations, machines)
              solver = JSSPSolver(instance)
              times = []
              for _ in range(50):
                  start = time.perf_counter()
                  solver.solve()
                  times.append(time.perf_counter() - start)
              results['jssp_5x5_baseline'] = {'mean_ms': sum(times)/len(times)*1000}
          except Exception as e:
              results['jssp_5x5_baseline'] = {'error': str(e)}
          
          with open('baseline-benchmark.json', 'w') as f:
              json.dump(results, f, indent=2)
          "

      - uses: actions/checkout@v4

      - name: Run PR benchmarks
        run: |
          python -c "
          import time, json, sys
          sys.path.insert(0, '.')
          results = {}
          try:
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              n_jobs, n_machines = 5, 5
              durations = [[3,2,4,1,5],[2,4,3,5,1],[4,1,5,2,3],[1,5,2,3,4],[5,3,1,4,2]]
              machines = [[0,1,2,3,4],[1,0,3,2,4],[2,3,0,4,1],[3,4,1,0,2],[4,2,3,1,0]]
              instance = JSSPInstance(n_jobs, n_machines, durations, machines)
              solver = JSSPSolver(instance)
              times = []
              for _ in range(50):
                  start = time.perf_counter()
                  solver.solve()
                  times.append(time.perf_counter() - start)
              results['jssp_5x5_pr'] = {'mean_ms': sum(times)/len(times)*1000}
          except Exception as e:
              results['jssp_5x5_pr'] = {'error': str(e)}
          
          with open('pr-benchmark.json', 'w') as f:
              json.dump(results, f, indent=2)
          "

      - name: Compare benchmarks
        run: |
          python -c "
          import json
          
          with open('baseline-benchmark.json') as f:
              baseline = json.load(f)
          with open('pr-benchmark.json') as f:
              pr = json.load(f)
          
          regressions = []
          for key_b, key_p in [('jssp_5x5_baseline', 'jssp_5x5_pr')]:
              if key_b in baseline and key_p in pr:
                  if 'mean_ms' in baseline[key_b] and 'mean_ms' in pr[key_p]:
                      base = baseline[key_b]['mean_ms']
                      curr = pr[key_p]['mean_ms']
                      change = ((curr - base) / base) * 100
                      status = 'REGRESSION' if change > 20 else 'OK'
                      print(f'{status}: {key_p} — baseline: {base:.3f}ms, PR: {curr:.3f}ms, change: {change:+.1f}%')
                      if change > 20:
                          regressions.append(key_p)
          
          if regressions:
              print(f'::warning::Performance regression detected in: {regressions}')
          else:
              print('No significant performance regressions detected')
          "
