name: Benchmark

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly benchmark run — every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of benchmark iterations"
        required: false
        default: "100"
      problem_size:
        description: "Problem size (small/medium/large)"
        required: false
        default: "medium"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ── Micro Benchmarks ───────────────────────────────────────────
  micro-benchmarks:
    name: Micro Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest pytest-benchmark
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run micro benchmarks
        run: |
          python -c "
          import time
          import json
          import sys
          import os
          sys.path.insert(0, '.')
          
          iterations = int(os.getenv('BENCH_ITERATIONS', '100'))
          results = {'metadata': {'iterations': iterations, 'timestamp': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}, 'benchmarks': {}}
          
          # ── JSSP Solver Benchmark ──
          try:
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              
              sizes = [(5, 5), (10, 10), (15, 10)]
              for n_jobs, n_machines in sizes:
                  # Generate random instance
                  import random
                  random.seed(42)
                  durations = [[random.randint(1, 10) for _ in range(n_machines)] for _ in range(n_jobs)]
                  machines = [list(range(n_machines)) for _ in range(n_jobs)]
                  for m in machines:
                      random.shuffle(m)
                  
                  instance = JSSPInstance(n_jobs, n_machines, durations, machines)
                  solver = JSSPSolver(instance)
                  
                  # Warmup
                  for _ in range(10):
                      solver.solve()
                  
                  times = []
                  for _ in range(iterations):
                      start = time.perf_counter()
                      solution = solver.solve()
                      elapsed = time.perf_counter() - start
                      times.append(elapsed)
                  
                  times.sort()
                  key = f'jssp_{n_jobs}x{n_machines}'
                  results['benchmarks'][key] = {
                      'mean_ms': sum(times) / len(times) * 1000,
                      'median_ms': times[len(times)//2] * 1000,
                      'p95_ms': times[int(len(times)*0.95)] * 1000,
                      'p99_ms': times[int(len(times)*0.99)] * 1000,
                      'min_ms': times[0] * 1000,
                      'max_ms': times[-1] * 1000,
                      'stdev_ms': (sum((t - sum(times)/len(times))**2 for t in times) / len(times))**0.5 * 1000,
                      'makespan': solution.makespan if hasattr(solution, 'makespan') else None,
                      'throughput_ops_sec': 1.0 / (sum(times) / len(times)) if sum(times) > 0 else 0
                  }
                  print(f'  {key}: {results[\"benchmarks\"][key][\"mean_ms\"]:.3f} ms (mean)')
          except Exception as e:
              results['benchmarks']['jssp'] = {'error': str(e)}
              print(f'  JSSP benchmark error: {e}')
          
          # ── RCPSP Solver Benchmark ──
          try:
              from kernels.scheduling.rcpsp import RCPSPSolver, RCPSPInstance
              
              sizes = [(10, 2), (20, 3), (30, 4)]
              for n_tasks, n_resources in sizes:
                  import random
                  random.seed(42)
                  durations = [random.randint(1, 10) for _ in range(n_tasks)]
                  resource_reqs = [[random.randint(0, 2) for _ in range(n_resources)] for _ in range(n_tasks)]
                  resource_avail = [3] * n_resources
                  predecessors = [[] for _ in range(n_tasks)]
                  for i in range(1, n_tasks):
                      predecessors[i] = random.sample(range(i), min(random.randint(0, 2), i))
                  
                  instance = RCPSPInstance(n_tasks, n_resources, durations, resource_reqs, resource_avail, predecessors)
                  solver = RCPSPSolver(instance)
                  
                  # Warmup
                  for _ in range(10):
                      solver.solve()
                  
                  times = []
                  for _ in range(iterations):
                      start = time.perf_counter()
                      solution = solver.solve()
                      elapsed = time.perf_counter() - start
                      times.append(elapsed)
                  
                  times.sort()
                  key = f'rcpsp_{n_tasks}t_{n_resources}r'
                  results['benchmarks'][key] = {
                      'mean_ms': sum(times) / len(times) * 1000,
                      'median_ms': times[len(times)//2] * 1000,
                      'p95_ms': times[int(len(times)*0.95)] * 1000,
                      'p99_ms': times[int(len(times)*0.99)] * 1000,
                      'min_ms': times[0] * 1000,
                      'max_ms': times[-1] * 1000,
                      'stdev_ms': (sum((t - sum(times)/len(times))**2 for t in times) / len(times))**0.5 * 1000,
                      'makespan': solution.makespan if hasattr(solution, 'makespan') else None,
                      'throughput_ops_sec': 1.0 / (sum(times) / len(times)) if sum(times) > 0 else 0
                  }
                  print(f'  {key}: {results[\"benchmarks\"][key][\"mean_ms\"]:.3f} ms (mean)')
          except Exception as e:
              results['benchmarks']['rcpsp'] = {'error': str(e)}
              print(f'  RCPSP benchmark error: {e}')
          
          # ── Memory Benchmark ──
          try:
              import tracemalloc
              tracemalloc.start()
              
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              import random
              random.seed(42)
              n_jobs, n_machines = 20, 20
              durations = [[random.randint(1, 10) for _ in range(n_machines)] for _ in range(n_jobs)]
              machines = [list(range(n_machines)) for _ in range(n_jobs)]
              for m in machines:
                  random.shuffle(m)
              
              instance = JSSPInstance(n_jobs, n_machines, durations, machines)
              solver = JSSPSolver(instance)
              solver.solve()
              
              current, peak = tracemalloc.get_traced_memory()
              tracemalloc.stop()
              
              results['benchmarks']['memory_jssp_20x20'] = {
                  'current_kb': current / 1024,
                  'peak_kb': peak / 1024
              }
              print(f'  memory_jssp_20x20: {peak/1024:.1f} KB peak')
          except Exception as e:
              results['benchmarks']['memory'] = {'error': str(e)}
          
          # Save results
          with open('benchmark-results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          print(f'\\nResults saved to benchmark-results.json')
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results.json
          retention-days: 90

      - name: Benchmark summary
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Mean (ms) | P95 (ms) | P99 (ms) | Throughput (ops/s) |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|----------|----------|-------------------|"
          python -c "
          import json
          with open('benchmark-results.json') as f:
              data = json.load(f)
          for name, metrics in data.get('benchmarks', {}).items():
              if 'error' in metrics:
                  print(f'| {name} | ERROR | - | - | - |')
              elif 'mean_ms' in metrics:
                  print(f'| {name} | {metrics[\"mean_ms\"]:.3f} | {metrics.get(\"p95_ms\", 0):.3f} | {metrics.get(\"p99_ms\", 0):.3f} | {metrics.get(\"throughput_ops_sec\", 0):.1f} |')
              elif 'peak_kb' in metrics:
                  print(f'| {name} | {metrics[\"peak_kb\"]:.1f} KB peak | - | - | - |')
          " >> $GITHUB_STEP_SUMMARY

  # ── Throughput Benchmarks ──────────────────────────────────────
  throughput-benchmarks:
    name: Throughput Benchmarks
    runs-on: ubuntu-latest
    needs: micro-benchmarks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Run throughput benchmarks
        run: |
          python -c "
          import time
          import json
          import sys
          sys.path.insert(0, '.')
          
          results = {}
          
          # Message throughput benchmark
          try:
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              import random
              random.seed(42)
              
              n_jobs, n_machines = 10, 10
              durations = [[random.randint(1, 10) for _ in range(n_machines)] for _ in range(n_jobs)]
              machines = [list(range(n_machines)) for _ in range(n_jobs)]
              for m in machines:
                  random.shuffle(m)
              
              instance = JSSPInstance(n_jobs, n_machines, durations, machines)
              solver = JSSPSolver(instance)
              
              # Sustained throughput test
              duration_sec = 5
              start = time.perf_counter()
              count = 0
              while time.perf_counter() - start < duration_sec:
                  solver.solve()
                  count += 1
              elapsed = time.perf_counter() - start
              
              results['sustained_throughput'] = {
                  'total_solves': count,
                  'duration_sec': elapsed,
                  'solves_per_sec': count / elapsed,
                  'mean_latency_ms': (elapsed / count) * 1000
              }
              print(f'Sustained throughput: {count/elapsed:.1f} solves/sec over {elapsed:.1f}s')
          except Exception as e:
              results['sustained_throughput'] = {'error': str(e)}
          
          # Tail latency benchmark
          try:
              from kernels.scheduling.jssp import JSSPSolver, JSSPInstance
              import random
              random.seed(42)
              
              n_jobs, n_machines = 10, 10
              durations = [[random.randint(1, 10) for _ in range(n_machines)] for _ in range(n_jobs)]
              machines = [list(range(n_machines)) for _ in range(n_jobs)]
              for m in machines:
                  random.shuffle(m)
              
              instance = JSSPInstance(n_jobs, n_machines, durations, machines)
              solver = JSSPSolver(instance)
              
              # Collect latencies
              latencies = []
              for _ in range(1000):
                  start = time.perf_counter()
                  solver.solve()
                  latencies.append((time.perf_counter() - start) * 1000)
              
              latencies.sort()
              results['tail_latency'] = {
                  'p50_ms': latencies[500],
                  'p90_ms': latencies[900],
                  'p95_ms': latencies[950],
                  'p99_ms': latencies[990],
                  'p999_ms': latencies[999],
                  'max_ms': latencies[-1]
              }
              print(f'Tail latency: p50={latencies[500]:.3f}ms, p99={latencies[990]:.3f}ms, max={latencies[-1]:.3f}ms')
          except Exception as e:
              results['tail_latency'] = {'error': str(e)}
          
          with open('throughput-results.json', 'w') as f:
              json.dump(results, f, indent=2)
          "

      - name: Upload throughput results
        uses: actions/upload-artifact@v4
        with:
          name: throughput-results-${{ github.run_id }}
          path: throughput-results.json
          retention-days: 90

  # ── Comparative Analysis ───────────────────────────────────────
  comparative-analysis:
    name: Comparative Analysis
    runs-on: ubuntu-latest
    needs: [micro-benchmarks, throughput-benchmarks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate comparative report
        run: |
          python -c "
          import json
          import os
          import glob
          
          # Find all benchmark results
          results = {}
          for f in glob.glob('artifacts/**/benchmark-results.json', recursive=True):
              with open(f) as fh:
                  data = json.load(fh)
                  run_id = f.split('/')[1].replace('benchmark-results-', '')
                  results[run_id] = data
          
          # Generate markdown report
          report = ['# ULL Benchmark Comparative Report', '']
          report.append(f'Generated: {len(results)} runs analyzed')
          report.append('')
          
          for run_id, data in sorted(results.items()):
              report.append(f'## Run: {run_id}')
              report.append('')
              for name, metrics in data.get('benchmarks', {}).items():
                  if 'mean_ms' in metrics:
                      report.append(f'- **{name}**: {metrics[\"mean_ms\"]:.3f} ms (mean), {metrics.get(\"p95_ms\", 0):.3f} ms (p95)')
              report.append('')
          
          with open('comparative-report.md', 'w') as f:
              f.write('\\n'.join(report))
          
          print('Comparative report generated')
          "

      - name: Upload comparative report
        uses: actions/upload-artifact@v4
        with:
          name: comparative-report
          path: comparative-report.md
          retention-days: 90
