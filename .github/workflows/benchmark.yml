name: Native host evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/export_atlas_run.py --output output/native-host --iterations 10000 --warmup 1000
      - uses: actions/upload-artifact@v4
        with:
          name: native-host-evidence
          path: output/native-host/
          if-no-files-found: error