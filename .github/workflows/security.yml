name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan — every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static Application Security Testing ────────────────────────
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit semgrep safety

      - name: Bandit SAST
        run: |
          bandit -r kernels/ evaluation/ benchmarks/ tests/ \
            -f json \
            -o bandit-results.json \
            -ll \
            -ii || true
          bandit -r kernels/ evaluation/ benchmarks/ tests/ -f screen || true

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
          generateSarif: "1"

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30

  # ── Dependency Vulnerability Scan ──────────────────────────────
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pip-audit safety

      - name: pip-audit
        run: |
          pip-audit -r requirements.txt --format=json --output=pip-audit-results.json || true
          pip-audit -r requirements.txt --format=columns || true

      - name: Safety check
        run: |
          safety check --json --output safety-results.json || true
          safety check || true

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

      - name: Upload safety results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-results
          path: safety-results.json
          retention-days: 30

  # ── Secret Detection ───────────────────────────────────────────
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ── Infrastructure as Code Scan ────────────────────────────────
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: all
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.sarif
          retention-days: 30

  # ── Container Scan ─────────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check-dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found, skipping container scan"
          fi

      - name: Build Docker image
        if: steps.check-dockerfile.outputs.found == 'true'
        run: docker build -t ull-ci-scan:latest .

      - name: Trivy container scan
        if: steps.check-dockerfile.outputs.found == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ull-ci-scan:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        if: always() && steps.check-dockerfile.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

  # ── Fuzzing ────────────────────────────────────────────────────
  fuzzing:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fuzzing tools
        run: |
          pip install hypothesis numpy scipy networkx

      - name: Run generated scheduling invariants
        run: python -m unittest discover -s tests -p 'test_scheduling_properties.py' -v

  # ── Security Report ────────────────────────────────────────────
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, secret-detection, iac-scan, container-scan, fuzzing]
    if: always()
    steps:
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts

      - name: Generate security summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## Security job execution status\n\n')
              for name, job in json.loads(os.environ['JOB_RESULTS']).items():
                  report.write(f"- {name}: {job['result']}\n")
              report.write('\nSAST, dependency and IaC steps retain advisory findings; success is not a clean-security attestation. Inspect retained artifacts and step logs. Container scanning is skipped when no Dockerfile exists.\n')
          PYTHON
