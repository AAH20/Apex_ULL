[package]
name = "feed-handler"
version = "0.1.0"
edition = "2021"
description = "Ultra-low-latency market data feed handler with explicit mock DPDK, crossbeam channels, and parsing"
license = "AGPL-3.0-or-later"

[dependencies]
crossbeam-channel = "0.5"
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "feed_handler"
harness = false

[[bench]]
name = "matching_engine"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
