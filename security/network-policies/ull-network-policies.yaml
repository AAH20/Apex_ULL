          port: 9090

---
# Allow health checks from kubelet (node CIDR)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-health-checks
  namespace: ull
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: ull
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ull
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443

---
# Allow egress to external market data providers
apiVersion: networking.k8s.io/v1
